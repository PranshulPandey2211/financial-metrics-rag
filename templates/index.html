{% extends "base.html" %}
{% block content %}
<h1>Analyze a ticker</h1>
<form method="post" action="{{ url_for('analyze') }}" enctype="multipart/form-data">
  <p>
    <label>Ticker <input name="ticker" placeholder="AAPL" required /></label>
  </p>
  <p>
    <label>Annual report PDF (optional) <input type="file" name="annual_report" accept=".pdf" /></label>
  </p>
  <p><label><input type="checkbox" name="force_refresh" /> Ignore cached Yahoo data</label></p>

  {% for group_name, keys in theme_groups %}
    <fieldset>
      <legend>{{ group_name }}</legend>
      {% for key in keys %}
        <label><input type="checkbox" name="theme_{{ key }}" checked /> {{ themes[key]["label"] }}</label>
      {% endfor %}
    </fieldset>
  {% endfor %}

  <button type="submit">Run</button>
</form>
{% endblock %}
